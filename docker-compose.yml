name: heavylift-backend

services:
  app:
    image: ghcr.io/wahyupratama222/heavylift-backend:latest
    container_name: heavylift-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heavylift-net

  postgres:
    image: postgres:16-alpine
    container_name: heavylift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_heavylift_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - heavylift-net

  redis:
    image: redis:7-alpine
    container_name: heavylift-redis
    restart: unless-stopped
    volumes:
      - redis_heavylift_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - heavylift-net

volumes:
  postgres_heavylift_data:
  redis_heavylift_data:

networks:
  heavylift-net:
    driver: bridge